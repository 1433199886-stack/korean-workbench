<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>韩语学习工作台 🇰🇷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
/* ===== 全局重置 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:15px;color:#5d4e37;background:#fff9e8;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:15px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#f0d878;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 卡通奶油黄主题变量 ===== */
:root{
  --bg-main:#fff9e8;
  --bg-card:#ffffff;
  --bg-soft:#fff5d6;
  --primary:#f5a623;
  --primary-dark:#e8941a;
  --primary-light:#ffd97a;
  --accent:#ff8c69;
  --text-main:#5d4e37;
  --text-soft:#8b7a5c;
  --text-light:#b8a88a;
  --border:#f0e4c8;
  --shadow:0 4px 16px rgba(245,166,35,0.12);
  --shadow-hover:0 6px 24px rgba(245,166,35,0.18);
  --radius:16px;
  --radius-sm:10px;
}

/* ===== 应用布局 ===== */
#app{display:flex;height:100vh;height:100dvh}

/* ===== 左侧固定任务栏 ===== */
.sidebar{
  width:220px;
  background:linear-gradient(180deg,#fff5d6 0%,#ffeec2 100%);
  border-right:2px solid #f0d878;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  position:relative;
  z-index:100;
}
.sidebar-header{padding:24px 16px 20px;text-align:center;border-bottom:2px dashed #f0d878}
.sidebar-logo{font-size:32px;margin-bottom:6px}
.sidebar-title{font-size:18px;font-weight:700;color:#5d4e37}
.sidebar-subtitle{font-size:11px;color:#8b7a5c;margin-top:2px}

.nav-menu{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  color:#8b7a5c;
  font-size:14px;
  font-weight:500;
  margin-bottom:4px;
  transition:all 0.2s;
  cursor:pointer;
  border:2px solid transparent;
}
.nav-item:hover{background:rgba(245,166,35,0.1)}
.nav-item.active{
  background:linear-gradient(135deg,#ffd97a,#ffb84d);
  color:#fff;
  border-color:#f5a623;
  box-shadow:0 3px 12px rgba(245,166,35,0.25);
}
.nav-icon{font-size:20px;width:24px;text-align:center}
.nav-text{flex:1}

.sidebar-footer{padding:14px 16px;border-top:2px dashed #f0d878;font-size:11px;color:#8b7a5c;text-align:center}

/* ===== 移动端菜单按钮 ===== */
.menu-toggle{display:none;position:fixed;top:14px;left:14px;z-index:200;font-size:24px;background:rgba(255,255,255,0.9);border-radius:50%;width:44px;height:44px;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(93,78,55,0.4);z-index:150}

/* ===== 右侧主内容 ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);
  padding:18px 28px;
  border-bottom:2px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.main-title{font-size:22px;font-weight:700;color:#5d4e37;display:flex;align-items:center;gap:10px}
.main-title-icon{font-size:26px}
.main-content{flex:1;overflow-y:auto;padding:24px 28px;-webkit-overflow-scrolling:touch}
.main-content::-webkit-scrollbar{width:6px}

/* ===== 通用组件 ===== */
.card{
  background:var(--bg-card);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  border:2px solid var(--border);
  transition:box-shadow 0.2s;
}
.card:hover{box-shadow:var(--shadow-hover)}
.card-title{font-size:17px;font-weight:700;color:#5d4e37;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title{font-size:13px;font-weight:700;color:#8b7a5c;margin:20px 4px 10px;text-transform:uppercase;letter-spacing:0.5px}

.btn{padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;box-shadow:0 3px 10px rgba(245,166,35,0.25)}
.btn-primary:active{transform:scale(0.96)}
.btn-soft{background:var(--bg-soft);color:#5d4e37;border:2px solid var(--border)}
.btn-soft:active{transform:scale(0.96)}
.btn-small{padding:6px 12px;font-size:13px}
.btn-icon{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.btn-icon:active{transform:scale(0.92)}

.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.tag-primary{background:#fff5d6;color:#e8941a}
.tag-green{background:#e8f5e9;color:#2e7d32}
.tag-blue{background:#e3f2fd;color:#1565c0}
.tag-red{background:#fce4ec;color:#c62828}
.tag-purple{background:#f3e5f5;color:#6a1b9a}

/* 进度条 */
.progress-bar{height:10px;background:#fff5d6;border-radius:5px;overflow:hidden;margin:10px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#ffd97a,#f5a623,#ff8c69);border-radius:5px;transition:width 0.4s}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(93,78,55,0.9);color:#fff;padding:10px 24px;border-radius:24px;font-size:14px;z-index:9999;opacity:0;pointer-events:none;transition:all 0.3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(93,78,55,0.5);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:var(--radius);width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:2px solid var(--border)}
.modal-header h2{font-size:18px;font-weight:700;color:#5d4e37}
.modal-close{font-size:28px;color:#8b7a5c;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px}
.modal-footer{display:flex;gap:10px;padding:16px 20px;border-top:2px solid var(--border)}
.modal-footer button{flex:1}

/* ===== 四十音学习 ===== */
.hangul-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.hangul-card{
  background:var(--bg-card);
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  padding:16px 12px;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
  position:relative;
}
.hangul-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.hangul-card.active{border-color:var(--primary);background:var(--bg-soft);box-shadow:var(--shadow)}
.hangul-char{font-size:42px;font-weight:700;color:#f5a623;line-height:1.2;font-family:'Noto Sans KR',sans-serif}
.hangul-roman{font-size:12px;color:#8b7a5c;margin-top:4px}
.hangul-sound{font-size:11px;color:#b8a88a;margin-top:2px}
.hangul-type-tag{position:absolute;top:6px;right:6px}
.hangul-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.hangul-tab{padding:8px 16px;background:var(--bg-soft);border-radius:20px;font-size:13px;color:#8b7a5c;cursor:pointer;border:2px solid transparent}
.hangul-tab.active{background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;border-color:#f5a623}

/* 四十音详情面板 */
.hangul-detail{background:var(--bg-soft);border-radius:var(--radius);padding:20px;margin-top:16px;border:2px solid var(--primary-light)}
.hangul-detail-char{font-size:72px;font-weight:700;color:#f5a623;text-align:center;margin:10px 0}
.hangul-detail-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.hangul-detail-info-item{background:#fff;border-radius:10px;padding:10px}
.hangul-detail-info-label{font-size:11px;color:#8b7a5c;margin-bottom:4px}
.hangul-detail-info-value{font-size:14px;font-weight:600;color:#5d4e37}

/* 手写画布 */
.write-canvas-wrap{background:#fff;border-radius:var(--radius);padding:16px;margin-top:14px;border:2px solid var(--border)}
.write-canvas{width:100%;height:200px;border:2px dashed var(--primary-light);border-radius:10px;background:#fff;cursor:crosshair;touch-action:none;display:block}
.write-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}

/* 发音按钮 */
.play-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(245,166,35,0.3);transition:all 0.2s}
.play-btn:active{transform:scale(0.92)}
.play-btn-large{width:64px;height:64px;font-size:28px}

/* ===== 语法学习 ===== */
.grammar-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.grammar-filter{padding:6px 14px;background:var(--bg-soft);border-radius:16px;font-size:13px;color:#8b7a5c;cursor:pointer;border:2px solid transparent}
.grammar-filter.active{background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;border-color:#f5a623}
.grammar-item{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;transition:all 0.2s}
.grammar-item:hover{border-color:var(--primary-light)}
.grammar-item-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.grammar-item-title{font-size:16px;font-weight:700;color:#5d4e37}
.grammar-item-pattern{background:#fff5d6;padding:4px 12px;border-radius:8px;font-size:13px;color:#e8941a;font-family:monospace;margin:8px 0}
.grammar-item-meaning{color:#5d4e37;margin:8px 0;line-height:1.6}
.grammar-item-examples{background:var(--bg-soft);border-radius:10px;padding:12px;margin-top:10px}
.grammar-example{padding:6px 0;font-size:13px;color:#5d4e37;border-bottom:1px dashed var(--border)}
.grammar-example:last-child{border-bottom:none}
.grammar-note{background:#fff3cd;padding:10px 12px;border-radius:8px;font-size:12px;color:#8b7a5c;margin-top:10px;border-left:3px solid #ffc107}

/* ===== B站视频 ===== */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.video-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all 0.2s}
.video-card:hover{border-color:var(--primary-light);transform:translateY(-2px)}
.video-thumb{background:linear-gradient(135deg,#ffb84d,#ff8c69);height:120px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;position:relative}
.video-duration{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px}
.video-info{padding:12px}
.video-title{font-size:14px;font-weight:600;color:#5d4e37;line-height:1.4;margin-bottom:6px}
.video-up{font-size:12px;color:#8b7a5c}
.video-desc{font-size:11px;color:#b8a88a;margin-top:4px;line-height:1.4}
.video-play-btn{width:100%;padding:8px;background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer}

/* ===== 练习模块 ===== */
.practice-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.practice-type-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;transition:all 0.2s}
.practice-type-card:hover{border-color:var(--primary);background:var(--bg-soft)}
.practice-type-card.active{background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;border-color:#f5a623}
.practice-type-icon{font-size:32px;margin-bottom:8px}
.practice-type-name{font-size:15px;font-weight:700}
.practice-type-desc{font-size:11px;opacity:0.8;margin-top:4px}

.practice-box{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:24px}
.practice-question{font-size:18px;font-weight:600;color:#5d4e37;margin-bottom:20px;text-align:center}
.practice-hangul{font-size:32px;color:#f5a623;font-weight:700;margin:10px 0}
.practice-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.practice-option{padding:14px;background:var(--bg-soft);border:2px solid var(--border);border-radius:10px;font-size:14px;cursor:pointer;transition:all 0.15s;text-align:center}
.practice-option:hover{border-color:var(--primary)}
.practice-option.correct{background:#c8e6c9;border-color:#4caf50;color:#2e7d32}
.practice-option.wrong{background:#ffcdd2;border-color:#f44336;color:#c62828}
.practice-input{width:100%;padding:14px;border:2px solid var(--border);border-radius:10px;font-size:16px;text-align:center}
.practice-input:focus{border-color:var(--primary)}
.practice-feedback{text-align:center;margin-top:16px;padding:14px;border-radius:10px;font-weight:600}
.practice-feedback.correct{background:#e8f5e9;color:#2e7d32}
.practice-feedback.wrong{background:#fce4ec;color:#c62828}

/* ===== 单词学习 ===== */
.vocab-levels{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.vocab-level{padding:8px 16px;background:var(--bg-soft);border-radius:20px;font-size:13px;color:#8b7a5c;cursor:pointer;border:2px solid transparent}
.vocab-level.active{background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;border-color:#f5a623}
.vocab-search{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:24px;font-size:14px;margin-bottom:16px;background:#fff}
.vocab-search:focus{border-color:var(--primary)}
.vocab-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vocab-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:14px;transition:all 0.2s}
.vocab-card:hover{border-color:var(--primary-light);transform:translateY(-2px)}
.vocab-word{font-size:20px;font-weight:700;color:#f5a623;margin-bottom:4px}
.vocab-roman{font-size:12px;color:#b8a88a;margin-bottom:4px}
.vocab-meaning{font-size:14px;color:#5d4e37;margin-bottom:6px}
.vocab-pos{display:inline-block;padding:2px 8px;background:#fff5d6;border-radius:8px;font-size:11px;color:#e8941a;margin-bottom:6px}
.vocab-example{font-size:12px;color:#8b7a5c;margin-top:6px;padding:8px;background:var(--bg-soft);border-radius:8px;line-height:1.4}

/* ===== 对话场景 ===== */
.scene-selector{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.scene-btn{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px 8px;text-align:center;cursor:pointer;transition:all 0.2s}
.scene-btn:hover{border-color:var(--primary-light)}
.scene-btn.active{background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;border-color:#f5a623}
.scene-btn-icon{font-size:24px;margin-bottom:4px}
.scene-btn-name{font-size:11px;font-weight:600}

.scene-detail{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.scene-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px dashed var(--border)}
.scene-icon{font-size:32px}
.scene-title{font-size:18px;font-weight:700;color:#5d4e37}
.scene-desc{font-size:12px;color:#8b7a5c}
.dialogue-list{display:flex;flex-direction:column;gap:14px}
.dialogue-item{padding:14px;border-radius:12px}
.dialogue-item.a{background:#fff5d6;margin-right:40px}
.dialogue-item.b{background:#e8f5e9;margin-left:40px}
.dialogue-speaker{font-size:12px;font-weight:700;color:#8b7a5c;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.dialogue-kr{font-size:17px;font-weight:600;color:#5d4e37;line-height:1.4}
.dialogue-roman{font-size:12px;color:#b8a88a;margin-top:4px}
.dialogue-zh{font-size:13px;color:#8b7a5c;margin-top:4px}
.dialogue-note{font-size:11px;color:#f5a623;margin-top:8px;padding:8px;background:#fff;border-radius:6px;border-left:3px solid #ffd97a;line-height:1.4}
.dialogue-play{font-size:18px;cursor:pointer;opacity:0.6;transition:opacity 0.2s}
.dialogue-play:hover{opacity:1}

/* ===== 文化风俗 ===== */
.culture-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.culture-filter{padding:6px 14px;background:var(--bg-soft);border-radius:16px;font-size:13px;color:#8b7a5c;cursor:pointer;border:2px solid transparent}
.culture-filter.active{background:linear-gradient(135deg,#ffd97a,#f5a623);color:#fff;border-color:#f5a623}
.culture-item{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px}
.culture-item-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.culture-item-title{font-size:16px;font-weight:700;color:#5d4e37}
.culture-item-content{font-size:14px;color:#5d4e37;line-height:1.7;margin-bottom:12px}
.culture-tips{background:var(--bg-soft);border-radius:10px;padding:12px}
.culture-tips-title{font-size:12px;font-weight:700;color:#e8941a;margin-bottom:8px}
.culture-tip{font-size:13px;color:#5d4e37;padding:4px 0;padding-left:20px;position:relative}
.culture-tip::before{content:'💡';position:absolute;left:0}

/* ===== 拼写法则 ===== */
.rule-item{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.rule-item-title{font-size:16px;font-weight:700;color:#5d4e37;margin-bottom:8px}
.rule-item-desc{font-size:14px;color:#5d4e37;line-height:1.6;margin-bottom:10px}
.rule-examples{background:var(--bg-soft);border-radius:10px;padding:12px;margin-top:10px}
.rule-example{padding:6px 0;font-size:13px;color:#5d4e37;border-bottom:1px dashed var(--border);font-family:monospace}
.rule-example:last-child{border-bottom:none}
.rule-detail{background:#fff3cd;padding:10px 12px;border-radius:8px;font-size:12px;color:#8b7a5c;margin-top:10px;border-left:3px solid #ffc107}

/* 空状态 */
.empty{text-align:center;padding:40px 20px;color:#b8a88a}
.empty-icon{font-size:48px;margin-bottom:10px}

/* ===== 响应式 ===== */
@media(max-width:768px){
  .menu-toggle{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform 0.3s;z-index:200;box-shadow:4px 0 20px rgba(0,0,0,0.15)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .main{width:100%}
  .main-content{padding:16px;padding-top:60px}
  .main-header{padding:14px 16px 14px 64px}
  .main-title{font-size:18px}
  .hangul-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .practice-options{grid-template-columns:1fr}
  .vocab-list{grid-template-columns:1fr}
  .video-grid{grid-template-columns:1fr}
  .scene-selector{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <!-- 左侧固定任务栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🇰🇷</div>
      <div class="sidebar-title">韩语学习工作台</div>
      <div class="sidebar-subtitle">한국어 학습</div>
